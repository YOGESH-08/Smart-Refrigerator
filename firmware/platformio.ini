[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM6
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
  milesburton/DallasTemperature @ ^3.11.0
  paulstoffregen/OneWire @ ^2.3.8
  bblanchon/ArduinoJson @ ^6.21.5
  miguelbalboa/MFRC522 @ ^1.4.12
